[package]
authors = ["Brad Gibson <u007d@surus.com>"]
categories = []
description = "Ergonomic, static, contextual errors in Rust."
edition = "2021"
keywords = []
license = "MIT OR Apache-2.0"
name = "ctx_error"
readme = "README.md"
repository = "https://github.com/surus-inc/lab-ctx_error"
version = "0.1.0"

[lib]
name = "lib"
path = "src/lib.rs"

[dependencies]
bool_ext = "0.7.0"
termination = "0.1.2"
thiserror = "1.0.63"

[dev-dependencies]
assert2 = "0.3.15"

[profile.dev]
debug = true
debug-assertions = true
lto = false
opt-level = 0
panic = "unwind"
rpath = false

[profile.release]
codegen-units = 1
debug = false
debug-assertions = false
lto = "fat"
opt-level = 3
panic = "unwind"
rpath = false

[profile.test]
debug = true
debug-assertions = true
lto = false
opt-level = 0
rpath = false

[lints.rust]
# To use the `unsafe` keyword, do not remove the `unsafe_code = "forbid"` entry.
# Instead, prefer to change it to `unsafe_code = "deny"` + opt-in with local use of
# `#[allow(unsafe_code)]`'s on an as needed basis.
unsafe_code = "deny"
bare_trait_objects = "forbid"

rust_2018_idioms = { level = "warn", priority = -1 }

# Uncomment before ship to reconcile use of possibly redundant crates, debug remnants, missing
# license files and more
#blanket_clippy_restriction_lints = "allow"
#implicit_return = "allow"
#cargo = "warn"
#restriction = "warn"
#missing_docs = "warn"
#warnings = "deny"

[lints.clippy]
# Safety-critical application lints
arithmetic_side_effects = "deny"
float_cmp_const = "deny"
indexing_slicing = "deny"
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"

all = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# End of safety-critical application lints

enum_glob_use = "deny"
enum_variant_names = "allow"
equatable_if_let = "allow"
implicit_return = "allow"
items-after-statements = "allow"
iter_nth_zero = "allow"
match_bool = "allow"
match-same-arms = "allow"
missing_errors_doc = "allow"
module_name_repetitions = "allow"
obfuscated_if_else = "allow"
similar_names = "allow"
too_long_first_doc_paragraph = "allow"
unnecessary_wraps = "allow"
wildcard_imports = "deny"
